{% extends "base.html" %}

{% block title %}Entrar na Conta{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        
        <div class="text-center mb-4">
            <div class="logo-icon bg-primary bg-gradient text-white rounded-3 mx-auto d-flex align-items-center justify-content-center shadow-sm mb-2" style="width: 50px; height: 50px; font-size: 1.5rem;">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h2 class="fw-bold">Área Restrita</h2>
            <p class="text-muted">Acesse com suas credenciais de usuário</p>
        </div>
        
        <div class="card shadow border-0 p-3 p-md-4">
            <div class="card-body">
                <form method="POST">
                    
                    <!-- Username Field -->
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-muted small">
                            <i class="bi bi-person-fill me-1"></i> Usuário
                        </label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control form-control-lg border-2" 
                            placeholder="Nome de usuário"
                            required
                            autofocus
                        >
                    </div>
                    
                    <!-- Password Field -->
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-muted small">
                            <i class="bi bi-key-fill me-1"></i> Senha
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control form-control-lg border-2" 
                            placeholder="Sua senha secreta"
                            required
                        >
                    </div>
                    
                    <!-- Submit Button -->
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg bg-gradient py-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar no Sistema
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Registration Redirect -->
        <div class="text-center mt-4">
            <p class="text-muted small">Não possui uma conta? <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Registre-se gratuitamente</a></p>
        </div>
        
    </div>
</div>
{% endblock %}
