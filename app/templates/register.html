{% extends 'base.html' %}

{% block title %}Cadastro - MacroNutrition{% endblock %}

{% block content %}
<div class="row justify-content-center my-4 py-3">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon mx-auto d-flex align-items-center justify-content-center mb-3 shadow-sm" style="width: 54px; height: 54px; font-size: 1.75rem;">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h2 class="fw-bold text-dark mb-1">Criar Nova Conta</h2>
                <p class="text-muted small">Crie seu perfil para salvar seu histórico de taxas metabólicas</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Nome de Usuário</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" value="{{ username or '' }}" placeholder="Ex: joaosilva" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Endereço de E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="seuemail@exemplo.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="Mínimo 6 caracteres" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="confirm_password" class="form-label fw-semibold">Confirmar Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Repita a senha" required>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-teal w-100 py-2 fs-6 mb-3">
                    <i class="bi bi-check-circle-fill me-2"></i>Criar Minha Conta
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="text-muted small mb-0">Já possui uma conta? 
                    <a href="{{ url_for('auth.login') }}" class="text-teal fw-bold text-decoration-none ms-1">Fazer Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
